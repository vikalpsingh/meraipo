limit_req_zone $binary_remote_addr zone=email_signup:10m rate=5r/m;

map $uri $safe_access_log {
    default 1;
    ~^/api/(v1/)?ipo-alerts/ 0;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 3000;
    server_name _;
    access_log /var/log/nginx/access.log combined if=$safe_access_log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
    }

    # No token-bearing request paths in gateway access or upstream error logs.
    location ~ ^/api/(v1/)?ipo-alerts/ {
        access_log off;
        error_log /dev/null crit;
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/ipo-alerts/subscribe {
        limit_req zone=email_signup burst=3 nodelay;
        limit_req_status 429;
        access_log off;
        error_log /dev/null crit;
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
