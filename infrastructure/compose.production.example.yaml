# Copy to /secure/compose.prod.yaml; the host's existing HTTPS proxy must reach localhost:3000.
# Supply non-default database password and public HTTPS origin via /secure/meraipo.env.
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped
  gateway:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  scheduler:
    restart: unless-stopped
