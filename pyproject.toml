[project]
name = "meraipo"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "alembic>=1.14,<2", "redis>=5,<7", "celery[redis]>=5.4,<6", "argon2-cffi>=23,<26", "httpx>=0.28,<1", "boto3>=1.35,<2", "python-multipart>=0.0.20,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "aiosqlite>=0.20,<1", "ruff>=0.9,<1", "black>=25,<27", "mypy>=1.14,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["apps.api*", "apps.worker*", "packages*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.black]
line-length = 100
[tool.mypy]
ignore_missing_imports = true
files = ["packages/shared"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/e2e_server.py" = ["E402"]
